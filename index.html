<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>POOK – Narrativ · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:40px; }
pre { background:#111; padding:20px; border-left:3px solid #6cf; }
h1 { color:#6cf; }
</style>

<script type="module">
import { POOK } from "./pook.js";
import { NC_QUANTUM } from "../NC/NC_Quantum.js";
import { PQ_HYPER } from "../PQ/PQ_Hyper.js";
import { TMP_GHOST } from "../TMP/TMP_Ghost.js";

(async function(){

    const nc = NC_QUANTUM();
    const pq = PQ_HYPER(nc);
    const tmp = TMP_GHOST(pq);

    const core = POOK.core(nc, pq, tmp);
    const runtime = POOK.runtime(nc, pq, tmp);
    const classification = POOK.classify(core.stability);

    const RESPOS = ["RUN8","TMP","3hit90","dir","WpiR","MXU","CLONE","FAIL","9vec3tor"];

    let out = "POOK :: Narrativ\n-------------------------\n";

    RESPOS.forEach(r => {
        out += POOK.story(r) + "\n";
    });

    document.getElementById("pook").textContent = out;
    document.getElementById("core").textContent = JSON.stringify(core, null, 2);
    document.getElementById("runtime").textContent = JSON.stringify(runtime, null, 2);
    document.getElementById("class").textContent = classification;

})();
</script>

</head>

<body>

<h1>POOK – Narrativ · iki1uc</h1>

<pre id="pook"></pre>

<h1>POOK – Core</h1>
<pre id="core"></pre>

<h1>POOK – Runtime</h1>
<pre id="runtime"></pre>

<h1>POOK – Einordnung</h1>
<pre id="class"></pre>

</body>
</html>
